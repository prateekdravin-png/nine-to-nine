# wrangler.toml — how Cloudflare's Workers product builds and serves this.
#
# Only read when the project is a Worker. A Pages project ignores this file entirely and uses
# functions/api/*.js instead; both end up running the same handlers (see worker.js).
#
# Still to do by hand in the dashboard, because a secret cannot live in a file that is in git:
#   Settings → Variables and Secrets:  STATS_TOKEN, any long random string, kept secret
# Without it the game plays perfectly and /api/events answers 503, which is the point: nobody can
# read the collected stats until there is a token to check against.

name = "nine-to-nine"
main = "worker.js"
compatibility_date = "2026-09-13"

# npm run build assembles dist/ — the fifteen files the browser actually loads, and nothing else.
[build]
command = "npm run build"

# Serve those files for every request the worker does not handle itself.
[assets]
directory = "./dist"
binding = "ASSETS"

# Where play events are stored. This belongs here rather than in the dashboard: a binding added by
# hand there is wiped by the next deploy, because this file is what the deploy considers true.
# The id is an identifier, not a credential — it is useless to anyone outside the account.
[[kv_namespaces]]
binding = "STATS"
id = "fcedd20407994de39186d66eee360cb2"
