<!-- icon.svg — the app icon, and the source every store size is generated from.
     Drawn for a MASKABLE icon: Android crops it to a circle, a squircle or a rounded square depending
     on the launcher, and only the middle 80% is guaranteed to survive. The background therefore runs
     full bleed and everything that matters sits inside the safe circle. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="9 to 9">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141d2b"/>
      <stop offset="1" stop-color="#0b0f16"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cfe0ff"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- The desk lamp glow the office scene has, kept faint so the mark stays legible at 48px. -->
  <circle cx="256" cy="232" r="150" fill="#4d8dff" opacity="0.10"/>

  <!-- 9 to 9, the brand mark from the header, centred inside the maskable safe zone. -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">
    <text x="256" y="272" font-size="185" font-weight="800" letter-spacing="-4" fill="url(#ink)">9<tspan
      font-size="102" font-weight="600" fill="#8a97ab" dx="6" dy="-26">to</tspan><tspan
      font-size="185" font-weight="800" fill="url(#ink)" dx="6" dy="26">9</tspan></text>
    <text x="256" y="348" font-size="46" font-weight="700" letter-spacing="7" fill="#f5b83d">DEEP WORK</text>
  </g>
</svg>
